version: '3.9'

services:
  # ── MongoDB Standalone (Dev Simplification) ──────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: agentoe-mongo
    hostname: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-agentoe_dev_pass}
      MONGO_INITDB_DATABASE: agentoe
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - agentoe-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: agentoe-redis
    ports:
      - "6380:6379"
    networks:
      - agentoe-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
    restart: unless-stopped

  # ── FastAPI Backend ──────────────────────────────────────────────────────
  api:
    build:
      context: ../services/backend
      dockerfile: Dockerfile.dev
    container_name: agentoe-api
    ports:
      - "8000:8000"
      - "50052:50051"
    environment:
      MONGODB_URI: "mongodb://admin:${MONGO_ROOT_PASSWORD:-agentoe_dev_pass}@mongo:27017/agentoe?authSource=admin"
      MONGODB_DB_NAME: agentoe
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:-dummy-key-for-dev}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/google-tts.json
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      ENVIRONMENT: development
    volumes:
      - ../services/backend:/app
      - ../scripts:/scripts
      - ./credentials:/app/credentials:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentoe-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 10s
    restart: unless-stopped

  # ── Nginx (API Gateway) ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: agentoe-nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - agentoe-net

  # ── React Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ../services/frontend
      dockerfile: Dockerfile
    container_name: agentoe-frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost/api/v1
    depends_on:
      - api
    networks:
      - agentoe-net
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:

networks:
  agentoe-net:
    driver: bridge
