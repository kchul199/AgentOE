name: "Generate kubeconfig for EKS"
description: "aws eks update-kubeconfig 로 EKS 클러스터 접근 설정. 이미 setup-aws-oidc 가 선행되어 있어야 한다."

inputs:
  cluster-name:
    description: "EKS 클러스터 이름"
    required: true
  aws-region:
    description: "EKS region"
    required: true
  context-alias:
    description: "kubectl context 이름 (기본=cluster-name)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Update kubeconfig
      shell: bash
      run: |
        ALIAS="${{ inputs.context-alias }}"
        if [[ -z "$ALIAS" ]]; then ALIAS="${{ inputs.cluster-name }}"; fi
        aws eks update-kubeconfig \
          --name "${{ inputs.cluster-name }}" \
          --region "${{ inputs.aws-region }}" \
          --alias "$ALIAS"
        kubectl config use-context "$ALIAS"

    - name: Smoke check
      shell: bash
      run: |
        kubectl version --client=true
        kubectl cluster-info | head -5
        kubectl get nodes -o wide
