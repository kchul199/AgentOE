name: "Helm deploy with diff + smoke"
description: |
  단일 차트를 helm upgrade --install 로 배포한다.
  - render-values.sh 로 REPLACE_* 토큰 치환 (terraform output JSON 필요)
  - helm-diff 로 변경점 PR comment / job summary 게시
  - --wait + smoke 단계 (livez/readyz)
  - 실패 시 자동 helm rollback (옵션)

inputs:
  chart-path:
    description: "Helm chart 경로 (deploy/helm/agentoe-backend 등)"
    required: true
  release:
    description: "Helm release 이름"
    required: true
  namespace:
    description: "K8s namespace"
    required: true
  values-file:
    description: "환경별 values 파일 경로"
    required: true
  image-tag:
    description: "image.tag override (보통 git sha)"
    required: true
  smoke-url:
    description: "Pod port-forward 후 호출할 path (livez 류). 빈 값이면 skip."
    required: false
    default: ""
  smoke-port:
    description: "smoke 포트-포워드 대상 포트"
    required: false
    default: "8000"
  rollback-on-failure:
    description: "true 면 deploy 실패 시 자동 helm rollback"
    required: false
    default: "true"
  diff-only:
    description: "true 면 helm-diff 만 출력하고 upgrade 는 skip (PR dry-run)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Render REPLACE_* tokens
      shell: bash
      working-directory: deploy/helm
      run: |
        # tf output JSON 은 호출 워크플로가 사전에 /tmp/agentoe-tf-${ENV}.json 으로 떨어뜨려 둠.
        : "${ENV:?must set ENV in workflow env}"
        scripts/render-values.sh "$ENV"
        echo "::group::values diff"
        git diff --no-color values/$ENV || true
        echo "::endgroup::"

    - name: Helm diff
      shell: bash
      working-directory: deploy/helm
      run: |
        echo "::group::helm diff"
        helm diff upgrade "${{ inputs.release }}" "${{ inputs.chart-path }}" \
          -n "${{ inputs.namespace }}" \
          -f "${{ inputs.values-file }}" \
          --set image.tag="${{ inputs.image-tag }}" \
          --no-color | tee /tmp/helm-diff.txt
        echo "::endgroup::"

        # job summary 에 diff 첨부
        {
          echo "## helm diff — \`${{ inputs.release }}\`"
          echo '```diff'
          head -c 60000 /tmp/helm-diff.txt   # 60KB cap
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Helm upgrade --install
      if: inputs.diff-only != 'true'
      shell: bash
      working-directory: deploy/helm
      run: |
        kubectl get ns "${{ inputs.namespace }}" >/dev/null 2>&1 \
          || kubectl create ns "${{ inputs.namespace }}"

        helm upgrade --install "${{ inputs.release }}" "${{ inputs.chart-path }}" \
          -n "${{ inputs.namespace }}" \
          -f "${{ inputs.values-file }}" \
          --set image.tag="${{ inputs.image-tag }}" \
          --wait --timeout 8m --atomic
        # --atomic = 실패 시 자동 롤백 (Helm 3 기본 동작에 가깝게).

    - name: Smoke (livez / readyz)
      if: inputs.diff-only != 'true' && inputs.smoke-url != ''
      shell: bash
      run: |
        SVC="svc/${{ inputs.release }}"
        kubectl -n "${{ inputs.namespace }}" rollout status deploy/${{ inputs.release }} --timeout=300s

        # 임시 포트포워드 → 호출 → 종료
        ( kubectl -n "${{ inputs.namespace }}" port-forward "$SVC" 18080:${{ inputs.smoke-port }} >/tmp/pf.log 2>&1 & )
        PF_PID=$!
        for i in $(seq 1 20); do
          sleep 1
          if curl -fsS "http://127.0.0.1:18080${{ inputs.smoke-url }}" >/tmp/smoke.json 2>/dev/null; then
            echo "smoke OK:"; cat /tmp/smoke.json; kill $PF_PID 2>/dev/null || true
            exit 0
          fi
        done
        echo "::error title=Smoke failed::see /tmp/smoke.json"
        kill $PF_PID 2>/dev/null || true
        exit 1

    - name: Rollback on failure
      if: failure() && inputs.diff-only != 'true' && inputs.rollback-on-failure == 'true'
      shell: bash
      run: |
        echo "::warning title=Rolling back::release=${{ inputs.release }}"
        helm rollback "${{ inputs.release }}" -n "${{ inputs.namespace }}" || true
        kubectl -n "${{ inputs.namespace }}" rollout status deploy/${{ inputs.release }} --timeout=180s || true
