name: Build & Publish Images

# - main 머지 시 (staging 향): 짧은 sha 태그
# - tag push 시 (prod 향): vX.Y.Z 태그 + sha 태그 동시
# IMMUTABLE 정책이므로 동일 태그 재푸시 불가 — 재시도 시 새 sha.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      services:
        description: "빌드할 서비스 (콤마, 비우면 모두). 예: backend,vbgw"
        required: false
        default: ""

permissions:
  id-token: write          # OIDC
  contents: read
  packages: write
  security-events: write   # SARIF upload

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false   # 빌드는 중도 취소하지 않음 — ECR 캐시 / 일관성

jobs:
  # ── 변경 경로 감지 — 변경 없는 서비스는 빌드 스킵 ──────────────────
  matrix:
    name: Plan build matrix
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.plan.outputs.services }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
      ecr_prefix: ${{ steps.tag.outputs.ecr_prefix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - name: Detect changed services
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:  ['backend/**']
            vbgw:     ['vbgw/**']
            frontend: ['frontend/**']

      - id: plan
        run: |
          # tag push 또는 workflow_dispatch 입력은 전체 빌드 의도로 간주.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo 'services=["backend","vbgw","frontend"]' >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ -n "${{ inputs.services }}" ]]; then
            arr=$(echo "${{ inputs.services }}" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";""))')
            echo "services=$arr" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # path filter 결과 기반
          arr='[]'
          [[ "${{ steps.changed.outputs.backend  }}" == "true" ]] && arr=$(echo "$arr" | jq -c '. + ["backend"]')
          [[ "${{ steps.changed.outputs.vbgw     }}" == "true" ]] && arr=$(echo "$arr" | jq -c '. + ["vbgw"]')
          [[ "${{ steps.changed.outputs.frontend }}" == "true" ]] && arr=$(echo "$arr" | jq -c '. + ["frontend"]')
          echo "services=$arr" >> "$GITHUB_OUTPUT"

      - id: tag
        run: |
          # tag push 면 vX.Y.Z, 아니면 git short sha
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PREFIX="${{ vars.ECR_PREFIX_PROD }}"
          else
            TAG="$(git rev-parse --short=12 HEAD)"
            PREFIX="${{ vars.ECR_PREFIX_STAGING }}"
          fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ecr_prefix=$PREFIX" >> "$GITHUB_OUTPUT"

  # ── 서비스별 빌드 → 스캔 → 푸시 (병렬) ────────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    needs: matrix
    if: needs.matrix.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.matrix.outputs.services) }}
        include:
          - service: backend
            context: backend
          - service: vbgw
            context: vbgw
          - service: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-aws-oidc
        with:
          role-arn:   ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: ./.github/actions/ecr-build-push
        id: push
        with:
          service:      ${{ matrix.service }}
          context:      ${{ matrix.context }}
          ecr-registry: ${{ vars.ECR_REGISTRY }}
          ecr-prefix:   ${{ needs.matrix.outputs.ecr_prefix }}
          image-tag:    ${{ needs.matrix.outputs.image_tag }}
          # 빌드 시 CI 메타 주입 (이미지 OCI label 로 노출)
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Summary
        run: |
          {
            echo "## ${{ matrix.service }} pushed"
            echo "- image: \`${{ steps.push.outputs.image }}\`"
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 모든 빌드가 끝났는지 게이트 (deploy 워크플로가 needs 로 참조) ───
  gate:
    name: Build gate
    needs: [matrix, build]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ needs.matrix.outputs.image_tag }}
      ecr_prefix: ${{ needs.matrix.outputs.ecr_prefix }}
    steps:
      - run: |
          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "::error::하나 이상의 build job 이 실패했습니다"
            exit 1
          fi
          echo "image_tag=${{ needs.matrix.outputs.image_tag }}"
          echo "ecr_prefix=${{ needs.matrix.outputs.ecr_prefix }}"
