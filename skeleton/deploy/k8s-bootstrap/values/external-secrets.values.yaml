# External Secrets Operator — production values
# AWS Secrets Manager → K8s Secret 동기화.

installCRDs: true

replicaCount: 2

# IRSA — Makefile 에서 role-arn annotation 주입.
serviceAccount:
  create: true
  name: external-secrets

nodeSelector:
  node-pool: system
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

# Webhook + CertController 도 동일 정책.
webhook:
  replicaCount: 2
  nodeSelector:
    node-pool: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

certController:
  replicaCount: 1
  nodeSelector:
    node-pool: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

resources:
  requests:
    cpu: 50m
    memory: 80Mi
  limits:
    cpu: 200m
    memory: 200Mi

serviceMonitor:
  enabled: true
