# cert-manager ClusterIssuer — Let's Encrypt 프로덕션 + 스테이징.
# DNS 검증 (Route53) — wildcard 인증서 발급 가능. external-dns 와 동일한 zone 사용.
# email/region 은 환경마다 다르면 kustomize/sed 로 치환.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@agentoe.io
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - selector:
          dnsZones:
            - "agentoe.io"
        dns01:
          route53:
            region: ap-northeast-2
            # IRSA 가 cert-manager SA 에 붙어 있어야 access 가 됨.
            # SA: cert-manager/cert-manager (chart default)
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@agentoe.io
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - selector:
          dnsZones:
            - "agentoe.io"
        dns01:
          route53:
            region: ap-northeast-2
