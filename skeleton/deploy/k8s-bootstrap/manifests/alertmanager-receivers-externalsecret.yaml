# Alertmanager 가 envFrom 으로 마운트할 시크릿.
# ESO 가 Secrets Manager 에서 동기화 — 평문 시크릿이 git 에 들어가지 않도록.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-receivers
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: agentoe-observability
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    # Helm values 의 alertmanager.alertmanagerSpec.secrets[] 에 동일 이름 등록 필요.
    name: alertmanager-receivers
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: agentoe-observability
  data:
    - secretKey: SLACK_API_URL_FILE
      remoteRef:
        key: agentoe/${ENV}/slack_webhook_ops
    - secretKey: PD_INTEGRATION_KEY_PRIMARY
      remoteRef:
        key: agentoe/${ENV}/pagerduty_routing_key_primary
