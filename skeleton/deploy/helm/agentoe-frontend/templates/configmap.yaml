apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentoe-frontend.fullname" . }}-runtime-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentoe-frontend.labels" . | nindent 4 }}
data:
  # entrypoint 가 이 키들로 envsubst → /usr/share/nginx/html/env.js 생성
  # 결과 파일은 SPA 가 startup 시 fetch('/env.js') 로 읽음.
  env.js.tmpl: |-
    window.__ENV__ = {
      {{- range $k, $v := .Values.runtimeEnv }}
      "{{ $k }}": "{{ $v }}",
      {{- end }}
    };
{{- if .Values.nginxConfig.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentoe-frontend.fullname" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentoe-frontend.labels" . | nindent 4 }}
data:
  default.conf: |-
{{ .Values.nginxConfig.data | indent 4 }}
{{- end }}
