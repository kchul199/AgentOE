{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentoe-vbgw.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentoe-vbgw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentoe-vbgw.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # backend NS 또는 같은 NS 내부 호출만 허용 (외부 NLB 가 enabled 면 별도 룰 필요).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingress.fromBackendNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingress.fromMonitoringNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.container.grpcPort }}
        - protocol: TCP
          port: {{ .Values.container.wsPort }}
        - protocol: TCP
          port: {{ .Values.container.metricsPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # backend / STT / TTS 외부 호출.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
{{- end }}
