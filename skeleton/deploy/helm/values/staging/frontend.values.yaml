# agentoe-frontend  ·  staging
image:
  repository: REPLACE_ECR_REGISTRY/agentoe-staging/frontend
  tag: ""

replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/group.name: agentoe-staging-public
    alb.ingress.kubernetes.io/group.order: "200"
    alb.ingress.kubernetes.io/certificate-arn: "REPLACE_ACM_ARN_STAGING"
  hosts:
    - host: app-staging.agentoe.io
      paths:
        - path: /
          pathType: Prefix

runtimeEnv:
  VITE_API_BASE_URL: "https://api-staging.agentoe.io"
  VITE_WS_BASE_URL: "wss://api-staging.agentoe.io"
  VITE_ENVIRONMENT: "staging"
  VITE_SENTRY_DSN: ""
  VITE_FEATURE_AGENTIC_BUILDER: "true"
