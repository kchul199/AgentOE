{{- if .Values.externalSecrets.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "agentoe-backend.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentoe-backend.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    # ESO 가 만들어 줄 K8s Secret 이름. Pod envFrom 에서 동일 이름 참조.
    name: {{ include "agentoe-backend.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          {{- include "agentoe-backend.labels" . | nindent 10 }}
  data:
    {{- range .Values.externalSecrets.data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: "{{ $.Values.externalSecrets.secretsPrefix }}/{{ .remoteKey }}"
        # property 가 있으면 JSON value 에서 키 추출 — Atlas/Google 등 multi-key 시크릿 케이스.
        {{- if .property }}
        property: {{ .property | quote }}
        {{- end }}
    {{- end }}
{{- end }}
