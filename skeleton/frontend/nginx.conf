# SPA + 런타임 env.js + health
# 컨테이너 nginx-unprivileged 가 8080 으로 listen.
server {
  listen 8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip — Vite 산출물 대상
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 보안 헤더
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

  # health (ALB)
  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # 런타임 환경 변수 — 캐시 금지 (배포 직후 즉시 반영)
  location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma no-cache;
    expires 0;
    try_files $uri =404;
  }

  # JS / CSS 자산 — content-hash 가 파일명에 박혀 있으므로 immutable 1y
  location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback — index.html 만 no-cache 로 항상 최신 가져오게
  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
