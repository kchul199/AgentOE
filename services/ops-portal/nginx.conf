# ops-portal nginx — SPA + /api 역방향 프록시 + SSE 버퍼링 해제 (Phase N — N2.6)
#
# BACKEND_UPSTREAM 은 docker-entrypoint.sh 가 envsubst 로 주입.
# 예: http://agentoe-backend.default.svc.cluster.local
#
# nginx-unprivileged 컨테이너: 8080 listen (root 없이).
server {
  listen 8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip — Vite 산출물 + API JSON 응답
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_proxied any;

  # 보안 헤더 (포탈은 내부 전용 — CSP 포함)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://chart.googleapis.com; connect-src 'self' ws: wss:;"
    always;

  # ── 헬스 (ALB health check) ─────────────────────────────────────────────
  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # ── SSE 스트림 엔드포인트 — 버퍼링 완전 비활성 ─────────────────────────
  # ALB idle timeout(60s) 안에서 heartbeat(15s) 가 커넥션 유지.
  # proxy_read_timeout: SSE 연결 수명 상한 (재연결은 클라이언트가 처리).
  location ^~ /api/v1/stream/ {
    proxy_pass         ${BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # SSE 핵심: 모든 버퍼 비활성
    proxy_buffering        off;
    proxy_cache            off;
    proxy_read_timeout     3600s;   # 1시간 — 클라이언트 재연결 루프가 관리
    proxy_connect_timeout  5s;
    proxy_send_timeout     60s;

    # nginx → upstream 연결 재사용 (gzip 이 SSE 방해하지 않도록)
    gzip off;

    # EventSource 가 Last-Event-ID 헤더를 보낼 수 있으므로 통과
    proxy_pass_request_headers on;
  }

  # ── 일반 API 프록시 ─────────────────────────────────────────────────────
  location ^~ /api/ {
    proxy_pass         ${BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";   # keep-alive (HTTP/1.1)

    proxy_read_timeout  30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout  10s;

    # 업스트림 에러 → 원본 응답 그대로 클라이언트에게 전달
    proxy_intercept_errors off;
  }

  # ── env.js — 캐시 금지 (ConfigMap 변경 시 즉시 반영) ─────────────────
  location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma no-cache;
    expires 0;
    try_files $uri =404;
  }

  # ── JS/CSS 자산 — content-hash immutable ─────────────────────────────
  location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ── SPA fallback (index.html) ────────────────────────────────────────
  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
