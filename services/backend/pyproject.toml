[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentoe-backend"
version = "1.0.0"
description = "AgentOE Multi-tenant Agentic AI Voice Callbot Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.4.0",
    "pymongo>=4.7.0",
    "redis[hiredis]>=5.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "groq>=0.9.0",
    "google-cloud-texttospeech>=2.16.0",
    "grpcio>=1.64.0",
    "grpcio-health-checking>=1.64.0",
    "grpcio-reflection>=1.64.0",
    "protobuf>=5.27.0",
    "websockets>=12.0",
    "structlog>=24.2.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.4.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
    # 통합 테스트 전용
    "pytest-httpserver>=1.0.10",   # JWKS 엔드포인트 mock
    "fakeredis>=2.23.0",           # Redis in-memory for quota E2E
    "cryptography>=42.0.0",        # RSA 키 생성 (JWT 서명 테스트)
    "grpcio-tools>=1.64.0",        # proto stub 재생성 (CI 검증)
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 커버리지는 참고용. 전체 cov-fail-under 는 CI 전용 프로파일에서 별도 적용.
addopts = "--cov=app --cov-report=term-missing --cov-report=xml -q"
markers = [
    "slow: 외부 I/O 또는 LLM 호출 포함 (CI에서 선택 실행)",
    "integration: DB/Redis/HTTP 의존 통합 테스트",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
# 테스트 모듈은 strict 적용 과다 — 살짝 완화
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures/*", "**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",              # isort
    "B",              # bugbear
    "UP",             # pyupgrade
    "SIM",            # simplifications
    "C4",             # comprehensions
    "ASYNC",          # 비동기 안티패턴
    "S",              # bandit (보안)
    "RUF",            # ruff-native
]
ignore = [
    "E501",   # line length — black/formatter가 담당
    "B008",   # FastAPI Depends 는 함수 시그니처 기본값
    "S101",   # assert 허용 (테스트/내부 가드)
    "S104",   # 0.0.0.0 bind (컨테이너)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B011", "ASYNC"]   # 테스트는 보안/어설션 완화
"app/agentic/scenario_compiler.py" = ["E402"]  # 선언적 import 순서

[tool.ruff.lint.isort]
known-first-party = ["app"]
