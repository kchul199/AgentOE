[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentoe-vbgw"
version = "0.1.0"
description = "Agentic Callbot Voice Bridge Gateway — gRPC + WebSocket 음성 브리지"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.62",
  "grpcio-health-checking>=1.62",
  "websockets>=12.0",
  "aiohttp>=3.9",
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "uvloop>=0.19; sys_platform != 'win32'",
  "google-cloud-speech>=2.26",
  "google-cloud-texttospeech>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.1", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]

[tool.setuptools]
packages = ["app"]
