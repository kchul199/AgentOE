worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time tenant=$http_x_tenant_id';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    # ── Rate Limiting ─────────────────────────────────────────────────────
    limit_req_zone $http_x_tenant_id zone=per_tenant:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;

    # ── Upstream ──────────────────────────────────────────────────────────
    upstream agentoe_api {
        server api:8000;
        keepalive 32;
    }

    # ── Server ────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        client_max_body_size 10m;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # Health check (rate limit 제외)
        location = /api/v1/health {
            proxy_pass http://agentoe_api;
            proxy_set_header Host $host;
        }

        # API routes
        location /api/ {
            limit_req zone=per_tenant burst=200 nodelay;
            limit_req zone=per_ip burst=50 nodelay;

            proxy_pass http://agentoe_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # WebSocket (실시간 음성 스트림)
        location /ws/ {
            proxy_pass http://agentoe_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;   # 1시간 (통화 세션)
            proxy_send_timeout 3600s;
        }

        # 정의되지 않은 경로
        location / {
            return 404 '{"error":"NOT_FOUND","message":"Invalid endpoint"}';
            add_header Content-Type application/json;
        }
    }
}
