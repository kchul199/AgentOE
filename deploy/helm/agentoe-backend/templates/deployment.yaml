apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentoe-backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentoe-backend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "agentoe-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentoe-backend.selectorLabels" . | nindent 8 }}
      annotations:
        # ConfigMap 변경 시 Pod 재기동 강제. Secret 은 ESO 가 자체 sync.
        checksum/config: {{ include "agentoe-backend.configChecksum" . }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.container.port | quote }}
        prometheus.io/path: "/api/v1/metrics/prometheus"
    spec:
      serviceAccountName: {{ include "agentoe-backend.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
            {{- if .Values.container.grpcEnabled }}
            - name: grpc
              containerPort: {{ .Values.container.grpcPort }}
              protocol: TCP
            {{- end }}
          env:
            # 동적 인스턴스 메타. 로그/메트릭 라벨에 활용.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Mongo / Redis URI 는 endpoints + secrets 조합. 컨테이너 안에서 entrypoint 가 합성하도록
            # 또는 templating 으로 직접 조립. 보안상 secret-only 부분 명시 분리.
            - name: REDIS_URL
              value: "rediss://default:$(REDIS_AUTH_TOKEN)@$(REDIS_HOST):$(REDIS_PORT)/0"
            - name: MONGODB_URI
              value: "mongodb+srv://agentoe_app:$(MONGO_APP_PASSWORD)@$(MONGODB_HOST)/$(MONGODB_DB_NAME)?retryWrites=true&w=majority&tls=true"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "agentoe-backend.fullname" . }}-config
            {{- if .Values.externalSecrets.enabled }}
            - secretRef:
                name: {{ include "agentoe-backend.fullname" . }}-secrets
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
