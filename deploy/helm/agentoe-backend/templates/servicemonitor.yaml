{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "agentoe-backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentoe-backend.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # 동일 namespace 의 Service 만 매칭. (cross-NS 가 필요하면 namespaceSelector 추가)
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "agentoe-backend.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: {{ .Values.serviceMonitor.port }}
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      # honorLabels — 앱이 labels(env, instance) 직접 박는 경우 보호.
      honorLabels: true
{{- end }}
