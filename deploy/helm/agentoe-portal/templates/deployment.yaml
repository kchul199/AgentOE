apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentoe-portal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentoe-portal.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "agentoe-portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentoe-portal.selectorLabels" . | nindent 8 }}
      annotations:
        # ConfigMap 변경 시 자동 롤링 재시작
        checksum/config: {{ include "agentoe-portal.configChecksum" . }}
    spec:
      serviceAccountName: {{ include "agentoe-portal.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          # BACKEND_UPSTREAM → nginx.conf.tmpl 치환 (docker-entrypoint.sh)
          env:
            - name: BACKEND_UPSTREAM
              value: {{ .Values.backendUpstream | quote }}
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # ConfigMap: nginx.conf.tmpl + env.js.tmpl
            - name: runtime-env
              mountPath: /etc/nginx/runtime-env
              readOnly: true
            # emptyDir: entrypoint 가 렌더한 default.conf 배치 (readOnlyRootFilesystem 호환)
            - name: nginx-confd
              mountPath: /etc/nginx/conf.d
            {{- if .Values.nginxConfig.enabled }}
            - name: nginx-config
              mountPath: /etc/nginx/runtime-env/default.conf.tmpl
              subPath: default.conf
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: runtime-env
          configMap:
            name: {{ include "agentoe-portal.fullname" . }}-runtime-env
        {{- if .Values.nginxConfig.enabled }}
        - name: nginx-config
          configMap:
            name: {{ include "agentoe-portal.fullname" . }}-nginx
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
