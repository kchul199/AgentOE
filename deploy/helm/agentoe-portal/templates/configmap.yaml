apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentoe-portal.fullname" . }}-runtime-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentoe-portal.labels" . | nindent 4 }}
data:
  # docker-entrypoint.sh 가 envsubst 로 처리 → /etc/nginx/conf.d/default.conf
  # ${BACKEND_UPSTREAM} 을 backendUpstream 값으로 치환.
  default.conf.tmpl: |-
    # ops-portal nginx — SSE + /api 프록시 (runtime rendered by entrypoint)
    server {
      listen 8080 default_server;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      gzip on;
      gzip_types text/plain text/css application/javascript application/json image/svg+xml;
      gzip_min_length 1024;
      gzip_proxied any;

      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;

      location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
      }

      # SSE 스트림 — 버퍼링 완전 해제
      location ^~ /api/v1/stream/ {
        proxy_pass         ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 5s;
        gzip               off;
        proxy_pass_request_headers on;
      }

      # 일반 API
      location ^~ /api/ {
        proxy_pass         ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout  30s;
        proxy_connect_timeout 5s;
      }

      location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
        try_files $uri =404;
      }

      location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
      }

      location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
      }
    }

  # SPA 런타임 변수 (선택 — 현재 ops-portal 은 nginx 프록시로 /api 직접 접근)
  env.js.tmpl: |-
    window.__ENV__ = {
      "ENVIRONMENT": "{{ .Values.environment | default "production" }}"
    };
{{- if .Values.nginxConfig.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentoe-portal.fullname" . }}-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentoe-portal.labels" . | nindent 4 }}
data:
  default.conf: |-
{{ .Values.nginxConfig.data | indent 4 }}
{{- end }}
