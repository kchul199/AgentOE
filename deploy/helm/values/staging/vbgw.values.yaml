# ──────────────────────────────────────────────────────────────────────────
# vbgw chart  ·  staging override  (multi-deployment: orchestrator/bridge/freeswitch)
#
# 적용:
#   helm upgrade --install vbgw ./deploy/helm/vbgw \
#     -n vbgw-staging --create-namespace \
#     -f deploy/helm/values/staging/vbgw.values.yaml
# ──────────────────────────────────────────────────────────────────────────

orchestrator:
  replicaCount: 2
  image:
    repository: REPLACE_ECR_REGISTRY/agentoe-staging/vbgw-orchestrator
    tag: ""        # CI 가 git sha 로 설정
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080

bridge:
  replicaCount: 2
  image:
    repository: REPLACE_ECR_REGISTRY/agentoe-staging/vbgw-bridge
    tag: ""
    pullPolicy: IfNotPresent

  # AI gRPC endpoint — Phase Y 후 AgentOE backend 가 VoicebotAiService 호스팅.
  # cutover 진행 시 이 값을 backend service 로 변경.
  # 현재 default: 자체 vbgw-ai (안전 기본값)
  grpcAiAddr: "ai-service:50051"
  grpcAiTLS: false

  # ── Canary cutover (Phase Z) — 일부 트래픽이 backend 로 ────────────
  canary:
    enabled: false                   # cutover 시작 시 true
    replicaCount: 1                  # stable 9 + canary 1 = 10% canary
    grpcAiAddr: "agentoe-backend.agentoe-staging.svc.cluster.local:50051"
    grpcAiTLS: false

freeswitch:
  replicaCount: 1
  image:
    repository: signalwire/freeswitch    # third-party — 직접 빌드 안 함
    tag: "1.10.12"
  service:
    type: LoadBalancer                  # SIP 외부 노출
    sipPort: 5060

redis:
  deploy: false                          # AgentOE staging 의 ElastiCache 공유 또는 별도 Redis
  host: "redis-master.agentoe-staging.svc.cluster.local"

ingress:
  enabled: false                         # vbgw 는 SIP/RTP 가 주력 — HTTP ingress 불필요
